name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DOPA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dopa.jks"
          echo "DOPA_KEYSTORE_PATH=$RUNNER_TEMP/dopa.jks" >> "$GITHUB_ENV"

      - name: Test, lint, build
        env:
          DOPA_KEYSTORE_PASSWORD: ${{ secrets.DOPA_KEYSTORE_PASSWORD }}
          DOPA_KEY_ALIAS: ${{ secrets.DOPA_KEY_ALIAS }}
          DOPA_KEY_PASSWORD: ${{ secrets.DOPA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dopa-cleaner-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
